name: Release

# Publishes a GitHub Release whenever a version tag (for example 0.1.3) is pushed.
# The release notes are taken from the matching section of CHANGELOG.md, and the
# AAR is attached. The tag must match the version in colay/build.gradle.kts.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish or refresh (for example 0.1.2)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check that the tag matches the SDK version
        run: |
          grep -q "version = \"$TAG\"" colay/build.gradle.kts || { echo "::error::colay/build.gradle.kts version is not $TAG"; exit 1; }
          grep -q "SDK_VERSION\", \"\\\\\"$TAG\\\\\"\"" colay/build.gradle.kts || { echo "::error::SDK_VERSION is not $TAG"; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for [$TAG]"; exit 1
          fi
          cat >> notes.md <<NOTES

          ## Installation

          \`\`\`kotlin
          // settings.gradle.kts
          maven { url = uri("https://jitpack.io") }

          // app/build.gradle.kts
          implementation("com.github.gidysoft:colay-sdk-android:$TAG")
          \`\`\`

          Full changelog: [CHANGELOG.md](https://github.com/gidysoft/colay-sdk-android/blob/$TAG/CHANGELOG.md)
          NOTES
          cat notes.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release build
        run: |
          ./gradlew :colay:testDebugUnitTest :colay:assembleRelease :example:testDebugUnitTest
          cp colay/build/outputs/aar/colay-release.aar "colay-sdk-android-$TAG.aar"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            gh release upload "$TAG" "colay-sdk-android-$TAG.aar" --clobber
          else
            gh release create "$TAG" "colay-sdk-android-$TAG.aar" --verify-tag --title "$TAG" --notes-file notes.md
          fi

      - name: Warm up the JitPack build
        continue-on-error: true
        run: curl -fsS --max-time 600 -o /dev/null "https://jitpack.io/com/github/gidysoft/colay-sdk-android/$TAG/colay-sdk-android-$TAG.pom"
